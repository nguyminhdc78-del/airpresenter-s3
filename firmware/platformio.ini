[platformio]
default_envs = esp32s3-supermini

[env:esp32s3-supermini]
platform = espressif32@7.0.1   ; pinned: BLE notify behaviour depends on core + NimBLE versions
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE host task stack 4096 -> 6144 bytes: headroom for the GAP callbacks (a core 0
    ; panic was seen while a PC reconnected several times per second)
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
    ; Each paired PC keeps up to 5 subscriptions (CCCDs). The default 8 slots for all hosts
    ; made pairing a 2nd PC silently delete the 1st PC's pairing (it then loops
    ; connect/disconnect). 4 hosts x 5 + spare.
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=24
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1

[env:native]
; Host-side unit tests: `pio test -e native` (runs on the PC, no board needed).
; build_src_filter keeps Arduino/NimBLE sources out; only pure logic is compiled.
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<gyro-air-mouse-motion-mapper.cpp>
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -I src
